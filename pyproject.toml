[project]
name = "nanoslam"
version = "0.1.0"
description = "a simple and accurate monocular SLAM in Python"
readme = "README.md"
authors = [{ name = "Tom Primozic", email = "tom@primozic.org" }]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "opencv-contrib-python>=5.0.0.93",
    "pandas>=3.1.0",
    "poselib>=2.0.5",
    "pycolmap>=4.2.1",
    "pyyaml>=6.0.3",
    "rerun-sdk>=0.40.0",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
]

[tool.uv]
package = false
